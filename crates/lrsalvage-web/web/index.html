<title>lrsalvage — the fs seam in a browser</title>
<!--
  The harness's page. It is not the product's UI (#117's other slices are): it
  mounts one synthetic vault and prints whether the browser answered what the
  desktop answered. `scripts/browser-parity.sh` serves this directory and reads
  `window.__result` back over the Chrome DevTools Protocol.

  It must be served with `Cross-Origin-Opener-Policy: same-origin` and
  `Cross-Origin-Embedder-Policy: require-corp`: the seam's synchronous bridge
  parks a worker on a `SharedArrayBuffer`, and a page that is not cross-origin
  isolated cannot make one.
-->
