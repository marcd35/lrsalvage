[package]
name = "lrsalvage-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Salvage JPEG previews from Adobe Lightroom Classic catalogs"

# The crate page is what a reader meets before the API docs, so each field below
# is a claim with a reader behind it rather than a blank the registry fills.
#   readme        — the page itself. Cargo cannot point at a file outside the
#                   package, so the crate root carries its own short copy, and
#                   that copy repeats no number from `docs/format-notes.md`.
#   keywords      — what someone recovering a catalog searches for; crates.io
#                   takes at most five, ASCII, 20 characters each.
#   categories    — slugs from the registry's own category list, so the crate is
#                   filed where those readers browse (`multimedia::images` is the
#                   images subcategory of `multimedia`).
#   documentation — the docs.rs build of this crate, which `cargo doc` already
#                   gates, so the page links the API rather than describing it.
#   homepage      — the repository, where the README, the format notes and the
#                   ADRs this page points at live. It repeats `repository`, so
#                   Cargo's `redundant_homepage` lint warns on every build while
#                   the two are equal; that warning is this field's known cost,
#                   not an oversight, because the crate page is read on its own.
readme = "README.md"
keywords = ["lightroom", "previews", "recovery", "catalog", "jpeg"]
categories = ["multimedia::images", "filesystem", "database"]
documentation = "https://docs.rs/lrsalvage-core"
homepage = "https://github.com/marcd35/lrsalvage"

# The test files a tarball cannot run. Two kinds are dropped: one that imports
# `lrsalvage-fixtures`, a `path`-only dev-dependency the published manifest drops,
# and one that reads outside the package root (the `specs` tree). `cargo package
# --list` prints what ships instead of this comment repeating it; the tests that
# need neither travel, so an unpacked crate runs a suite.
#
# A file under `src/` cannot be excluded — a crate missing a module does not
# compile — so no `#[cfg(test)]` code there may import the fixtures crate. That is
# why the fixture-dependent plan, extract and exif tests live in `tests/`
# (`specs/fixtures.md`, *Absorbing the three copies*), measured 2026-11-17 by
# unpacking `lrsalvage-core-0.3.0.crate` outside the repository: `cargo build`
# succeeded while `cargo test` failed with `unresolved module lrsalvage_fixtures`
# at five sites in `src/` (#123). `scripts/check.sh package` runs this tarball's
# suite outside the checkout, so the property cannot rot back.
exclude = [
    "tests/exif.rs",
    "tests/extract.rs",
    "tests/matrix.rs",
    "tests/package_tree.rs",
    "tests/pipeline.rs",
    "tests/plan.rs",
    "tests/spec_graph.rs",
]

[dependencies]
rusqlite.workspace = true
tempfile.workspace = true
walkdir.workspace = true
thiserror.workspace = true

sha2.workspace = true
flate2.workspace = true
base64 = "0.22"
serde_json.workspace = true
jiff = "0.2"
filetime = "0.2"
png = { version = "0.18", optional = true }

[features]
default = ["masks"]
masks = ["dep:png"]

# The browser's storage, for the `wasm32` half of the `fs` seam. It is a
# target-only block on purpose: the native build's dependency tree does not move,
# so the two crates that ship cannot gain a dependency (or a licence) from a
# slice about the other target. `sqlite-wasm-vfs` gives the origin-private file
# system a SQLite VFS (`sahpool`), which is what makes a catalog copy openable
# there at all: a page has no `open`/`read`/`seek` handle to hand SQLite, and the
# pool is the only persistent VFS the measured route had.
#
# `sqlite-wasm-rs` is named directly for its `WasmOsCallback` — the pool's
# callback into the browser — and `rsqlite-vfs` for the transfer traits that read
# and write a pooled file without SQLite in front of them.
[target.'cfg(target_arch = "wasm32")'.dependencies]
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3", features = ["sahpool"] }
rsqlite-vfs = "0.2"

[dev-dependencies]
# `path` only: a dev-dependency carrying a `version` is published to the index,
# and `lrsalvage-fixtures` is test-only (`publish = false`), so there is nothing
# to resolve. Adding one back breaks `cargo publish` for every crate that depends
# on it.
lrsalvage-fixtures = { path = "../lrsalvage-fixtures" }
serde_json.workspace = true
kamadak-exif = "0.6"
proptest.workspace = true
