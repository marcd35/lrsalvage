<title>lrsalvage — the app's entry and scan, driven</title>
<!--
  The app's harness page. It is not the product's page (`index.html` is): it drives
  the same functions the product page calls — `web/app.js`'s `start`, its folder
  reading, its capability gate and its picker — with the one thing a headless
  browser cannot give them: an *answer* from a File System Access dialog.

  That is the finding this page exists for. Measured on Chrome 157.0.8103.79 in
  `--headless=new` (2026-11-19): `showDirectoryPicker` rejects with `AbortError`
  and no dialog, and with `Page.setInterceptFileChooserDialog` the protocol's
  `Page.fileChooserOpened` carries no `backendNodeId` and `Page.handleFileChooser`
  does not exist — so no automation we have can accept a pick. A *cancelled* pick
  is therefore driven for real here, and an accepted one is supplied as the value
  a pick returns: a `FileSystemDirectoryHandle`, which origin-private storage
  hands out with the same API.

  `scripts/browser-app.sh` serves this page and `scripts/drive-browser.mjs` reads
  `window.__result` back over the DevTools protocol.
-->
