[package]
name = "lrsalvage-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The lrsalvage browser app: the page, and the one entry a run goes through"
publish = false

# A `cdylib` is what the page loads. The `rlib` half is what `lrsalvage-web`
# links — harness depends on app, never the reverse — and what lets the entry be
# driven from a native test.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lrsalvage-core = { path = "../lrsalvage-core" }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The one thing that turns a `cdylib` into something a page can call. Target
# only: the native build's tree does not move, and `wasm-bindgen-cli` at the
# version the lock names is what `scripts/browser-app.sh` needs.
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native only, and harness-only in effect: the synthetic vaults the entry is
# driven against, and the one walk that copies one for a page to fetch. Neither
# compiles for `wasm32`; `specs/fixtures.md` says why a test that needs bytes
# takes them from here rather than from a fixture of its own.
lrsalvage-fixtures = { path = "../lrsalvage-fixtures" }
walkdir.workspace = true
