[workspace]
resolver = "3"
members = [
    "crates/lrsalvage-core",
    "crates/lrsalvage-cli",
    "crates/lrsalvage-fixtures",
    # The browser app: the shipped page (`0.1.0`, ADR 0012 D10) and its one
    # entry. `publish = false`; it is the page, not a crate anybody installs.
    "crates/lrsalvage-app",
    # The browser parity harness: a `cdylib` a page loads, plus the native half of
    # the comparison. `publish = false`; no gate runs it (`specs/modules/fs.md`).
    "crates/lrsalvage-web",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marcd35/lrsalvage"
rust-version = "1.89"

[workspace.dependencies]
rusqlite = { version = "0.42", features = ["bundled"] }
clap = { version = "4.6", features = ["derive", "env"] }
walkdir = "2.5"
tempfile = "3"
thiserror = "2"

serde_json = "1"
sha2 = "0.11"
flate2 = "1"
indicatif = "0.18"
assert_cmd = "2.2"
predicates = "3.1"
proptest = "1.12"
