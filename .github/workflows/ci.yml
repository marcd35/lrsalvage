name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Keep the version in sync with rust-toolchain.toml. The action requires an
      # explicit input; specifying it here avoids depending on how the action
      # resolves the toolchain file.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The Rust gates live in scripts/check.sh so this job, AGENTS.md and
      # README.md cannot drift apart: they drifted once, and the documented
      # clippy lost its --all-targets and stopped linting test code.
      - name: Check
        run: sh scripts/check.sh fmt shell clippy test doc build

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
