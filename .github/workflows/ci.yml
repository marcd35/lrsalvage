name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Keep the version in sync with rust-toolchain.toml. The action requires an
      # explicit input; specifying it here avoids depending on how the action
      # resolves the toolchain file.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The Rust gates live in scripts/check.sh so this job, AGENTS.md and
      # README.md cannot drift apart: they drifted once, and the documented
      # clippy lost its --all-targets and stopped linting test code.
      - name: Check
        run: sh scripts/check.sh fmt shell clippy test doc build

  # The MSRV the manifest publishes, proven instead of asserted. This job holds no
  # version of its own: it imports `rust-version` from Cargo.toml, so raising that
  # number is the whole edit and the job follows it. A second literal is what let
  # the published floor drift three toolchains below the truth nobody ran.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every workspace crate inherits `rust-version.workspace`, so the members'
      # values are already resolved here; the max over them is what a reader is
      # promised, and an empty answer fails rather than installing nothing.
      # `RUSTUP_TOOLCHAIN` keeps this step off the checkout's rust-toolchain.toml,
      # which would otherwise download the pinned build toolchain this job never
      # uses.
      - name: Read the rust-version the manifest publishes
        id: msrv
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          set -eu
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].rust_version | select(. != null)]
                     | max_by(split(".") | map(tonumber)) // empty')
          if [ -z "$version" ]; then
            echo 'Cargo.toml publishes no rust-version to prove' >&2
            exit 1
          fi
          echo "proving rust-version = $version"
          echo "toolchain=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust ${{ steps.msrv.outputs.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check on the published MSRV
        run: cargo check --workspace --all-targets --locked

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
