name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # Keep the version in sync with rust-toolchain.toml. The action requires an
      # explicit input; specifying it here avoids depending on how the action
      # resolves the toolchain file.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The Rust gates live in scripts/check.sh so this job, AGENTS.md and
      # README.md cannot drift apart: they drifted once, and the documented
      # clippy lost its --all-targets and stopped linting test code.
      - name: Check
        run: sh scripts/check.sh fmt shell clippy test doc build

  # The MSRV the manifest publishes, proven instead of asserted. This job holds no
  # version and installs nothing of its own: the gate lives in scripts/check.sh
  # with every other gate, so a local run and this job are one command. It follows
  # `rust-version` in Cargo.toml, which is what raises the number and nothing else
  # — a second literal here is what let the published floor drift below the truth.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check on the published MSRV
        run: sh scripts/check.sh msrv

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The artifact: a tarball that builds from the manifest Cargo generates for it,
  # with no checkout to lean on. Every other gate reads the tree, so a packaged
  # tree the published metadata drops is invisible to all of them — #96's shape.
  # The generated manifests and the file lists do not vary by OS, so one runner
  # rather than the matrix.
  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: The tarballs
        run: sh scripts/check.sh package
