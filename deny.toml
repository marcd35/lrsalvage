# cargo-deny policy. Run locally with `cargo deny check` (or the prebuilt
# binary); CI runs the same command.
#
# The project is MIT OR Apache-2.0, so every dependency must be redistributable
# under those terms. Anything not listed below fails the build rather than being
# discovered later by a downstream user.

[advisories]
version = 2
# A yanked crate is a warning, not a failure: it can still be a sound
# dependency, and it may be pinned by something we cannot change yet.
yanked = "warn"
# RUSTSEC-2026-0543, ignored 2026-11-17: `chrono` is *unmaintained*. The advisory
# names no vulnerability and offers no upgrade — its only remedy is a replacement
# crate — so what it costs us is a maintenance debt, not a defect in the tree
# that carries it. We depend on it for one narrow, runtime job in
# `extract::set_capture_time`: parse a catalog timestamp, interpret it in the
# machine's local zone, and drop the mtime rather than guess when that local
# time is ambiguous. Ignoring the advisory is a dated decision rather than a
# preference — 0.2 ships with it, and the replacement is tracked as its own
# `vNext` issue — because the alternative leaves a release gate red for a reason
# that depends on when the advisory database was last fetched, not on our code.
ignore = ["RUSTSEC-2026-0543"]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is a policy, not an inventory: a licence nobody uses today is
# still permitted tomorrow.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    # Weak, file-level copyleft. Acceptable to link against; if this ever grows
    # into a strong-copyleft (GPL/AGPL) entry, that is a decision, not a config
    # tweak.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# One wildcard is permitted, and only this one: `lrsalvage-fixtures` is a path
# dev-dependency that must carry **no** `version`, because Cargo publishes a
# versioned dev-dependency to the index and `cargo publish` then refuses a
# package crates.io does not have. A path is therefore the whole requirement.
# The rule keeps its teeth where it was aimed: a registry requirement written as
# `serde = "*"` still fails, because this option only forgives paths.
allow-wildcard-paths = true
# No async runtime, no TLS stack: this tool is a file reader, and both would be
# pure attack surface.
deny = [
    { name = "tokio" },
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
