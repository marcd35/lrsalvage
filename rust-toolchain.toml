[toolchain]
# Pin the toolchain so local runs and CI compile with the same compiler.
# Bump deliberately; `cargo update` never touches this file.
#
# This is the build toolchain, not the MSRV. What a user needs is `rust-version`
# in `Cargo.toml`, which `scripts/check.sh msrv` proves.
channel = "1.100.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
