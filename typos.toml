# Spelling check for prose and identifiers.
#
# The defaults are deliberately strict; these entries are domain vocabulary and
# SQL aliases that are correct as written, not typos.

[default.extend-words]
fo = "fo"
fi = "fi"
rf = "rf"
unparseable = "unparseable"
mis = "mis"
# The plural of PNG: the checker splits `PNGs` into a `PN` token.
pn = "pn"

[files]
extend-exclude = ["target", "Cargo.lock"]
